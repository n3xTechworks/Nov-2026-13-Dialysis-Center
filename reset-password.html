<!DOCTYPE html>
<html lang="en" dir="ltr" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reset password | Tidewell</title>
  <meta name="description" content="Choose a new Tidewell password.">
  <meta name="theme-color" content="#0E7C86">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <script>
    (function () {
      try {
        var t = localStorage.getItem('tidewell-theme');
        var d = localStorage.getItem('tidewell-dir');
        if (t !== 'dark' && t !== 'light') t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.setAttribute('data-theme', t);
        document.documentElement.setAttribute('dir', d === 'rtl' ? 'rtl' : 'ltr');
      } catch (e) {}
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600;700&amp;family=Source+Sans+3:ital,wght@0,400;0,500;0,600;0,700;1,400&amp;display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/site.css">
  <link rel="stylesheet" href="css/pages/reset-password.css">
  <script defer src="data/site-data.js"></script>
  <script defer src="js/validation.js"></script>
  <script defer src="js/site.js"></script>
  <script defer src="js/pages/reset-password.js"></script>
</head>
<body class="">
<main id="main" class="auth auth--single">
  <div class="auth-form-wrap"><div class="auth-form auth-simple">
    <div class="auth-brand"><a class="brand" href="index.html" aria-label="Tidewell Dialysis Centre, home">
          <svg class="brand-mark" viewBox="0 0 48 48" width="40" height="40" aria-hidden="true" focusable="false">
            <rect width="48" height="48" rx="14" class="mark-bg"/>
            <path d="M24 9c5.5 7 9 11.6 9 16.2A9 9 0 0 1 15 25.2C15 20.6 18.5 16 24 9z" class="mark-drop"/>
            <path d="M17.2 27.4c2.3-1.6 4.5-1.6 6.8 0s4.5 1.6 6.8 0" class="mark-wave"/>
          </svg>
          <span class="brand-text"><span class="brand-name">Tidewell</span><span class="brand-sub">Dialysis Centre</span></span>
        </a>
</div>
    <div class="auth-card"><h1>Choose a new password</h1>
      <div data-rp="form">
        <p class="auth-lead">Pick something you have not used before. At least 8 characters, with a letter and a number.</p>
        <form class="form" data-validate novalidate id="rpForm" data-no-reset>
          <div class="field"><label for="rp-pw">New password</label><div class="pw-wrap"><input id="rp-pw" name="new-password" type="password" autocomplete="new-password" data-rule="password" placeholder="At least 8 characters" required><button class="pw-toggle" type="button" data-pw-toggle aria-label="Show password">Show</button></div>
            <div class="pw-meter" id="pwMeter" aria-hidden="true"><span></span><span></span><span></span><span></span></div><p class="field-hint" id="pwHint" aria-live="polite">At least 8 characters, with a letter and a number.</p></div>
          <div class="field"><label for="rp-pw2">Confirm new password</label><div class="pw-wrap"><input id="rp-pw2" name="confirm-password" type="password" autocomplete="new-password" data-rule="password" data-match="#rp-pw" placeholder="Repeat the password" required><button class="pw-toggle" type="button" data-pw-toggle aria-label="Show password">Show</button></div></div>
          <button class="btn btn-primary btn-lg btn-block" type="submit">Save new password</button>
        </form>
      </div>
      <div data-rp="done" hidden>
        <p class="form-success" role="status"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="m8 12 3 3 5-6"/></svg><span>Your password has been changed. You can now log in with it.</span></p>
        <div class="auth-actions"><a class="btn btn-primary btn-block" href="login.html">Log in</a></div>
      </div>
      <p class="auth-back"><a class="link" href="forgot-password.html">Link expired? Request a new one</a></p>
    </div>
  </div></div>
</main>
</body>
</html>
